{% extends 'profiles/base.html' %}

{% block title %}Editar Perfil - Socialize{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card shadow-sm border-0 mt-3">
            <div class="card-body p-4">
                <h3 class="card-title text-center mb-4 text-primary">Editar Perfil</h3>

                <!-- Importante: enctype="multipart/form-data" para permitir envio de imagens -->
                <form method="post" enctype="multipart/form-data">
                    {% csrf_token %}

                    <div class="mb-3">
                        <label class="form-label">Biografia</label>
                        {{ form.bio }}
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Foto de Perfil (Avatar)</label>
                        {{ form.avatar }}
                    </div>

                    <div class="d-flex justify-content-between align-items-center mt-4">
                        <a href="{% url 'profile_detail' request.user.username %}" class="btn btn-secondary">Cancelar</a>
                        <button type="submit" class="btn btn-primary fw-bold">Salvar Alterações</button>
                    </div>
                </form>

            </div>
        </div>
    </div>
</div>
{% endblock %}
