{% extends 'profiles/base.html' %}

{% block title %}Entrar - Socialize{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-4">
        <div class="card shadow-sm border-0 mt-4">
            <div class="card-body p-4">
                <h3 class="card-title text-center mb-4 text-primary">Acessar a Rede</h3>

                <form method="post">
                    {% csrf_token %}

                    {% if form.errors %}
                        <div class="alert alert-danger">
                            Usuário ou senha incorretos. Tente novamente.
                        </div>
                    {% endif %}

                    <div class="mb-3">
                        <label for="id_username" class="form-label">Usuário!</label>
                        <input type="text" name="username" class="form-control" id="id_username" required placeholder="Seu nome de usuário">
                    </div>

                    <div class="mb-3">
                        <label for="id_password" class="form-label">Senha</label>
                        <input type="password" name="password" class="form-control" id="id_password" required placeholder="Sua senha">
                    </div>

                    <button type="submit" class="btn btn-primary w-100">Entrar</button>
                </form>

                <hr class="my-4">
                <p class="text-center mb-0">
                    Não tem uma conta? <a href="{% url 'register' %}">Cadastre-se</a>
                </p>
            </div>
        </div>
    </div>
</div>
{% endblock %}
